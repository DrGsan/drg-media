name: Tests
on: [push, pull_request]
jobs:
  archive:
    runs-on: ubuntu-latest
    container: python:3.14
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        storage: [local, s3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: family_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: family_test
        options: --health-cmd "pg_isready -U family_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      # Gitea's runner executes JS actions with Node from the job image.
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs git ffmpeg
      - uses: actions/checkout@v4
      - name: Trust the checked-out CI workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e '.[test]' -c requirements.lock.txt
      - run: python scripts/check-public-content.py
      - run: python scripts/dependency-notices.py --check
      - if: matrix.database == 'sqlite'
        env:
          FP_TEST_STORAGE: ${{ matrix.storage }}
        run: python -m pytest -q
      - if: matrix.database == 'postgres'
        env:
          FP_TEST_DATABASE_URL: postgresql+psycopg://family_test:test-only-password@postgres:5432/family_test
          FP_TEST_STORAGE: ${{ matrix.storage }}
        run: python -m pytest -q
