name: drg-media

services:
  api:
    image: drg-media:local
    container_name: drg-media-api
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FP_DATA_DIR: /data
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - archive-data:/data
    healthcheck:
      test: ["CMD", "timeout", "--kill-after=1s", "3s", "/bin/bash", "/app/family_photo/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  worker:
    image: drg-media:local
    container_name: drg-media-worker
    restart: unless-stopped
    command: ["drg-media", "worker"]
    env_file: .env
    environment:
      FP_DATA_DIR: /data
    volumes:
      - archive-data:/data
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  archive-data:
    name: ${DRG_MEDIA_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-drg-media}_archive-data}
    external: ${DRG_MEDIA_EXTERNAL_VOLUMES:-false}
