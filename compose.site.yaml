# Optional override: attach the API to DrG Space's existing Compose network.
# Start with: docker compose -f compose.yaml -f compose.site.yaml up -d api
services:
  api:
    networks:
      default:
      drg-space:
        aliases: [drg-media, family-photo]
networks:
  drg-space:
    external: true
    # DRG_SITE_NETWORK remains a fallback for earlier installations.
    name: ${DRG_SPACE_NETWORK:-${DRG_SITE_NETWORK:-drg-space_default}}
