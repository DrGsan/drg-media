[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drg-media"
dynamic = ["version"]
description = "Self-hosted Telegram archive and DrG Space integration"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4", "SQLAlchemy>=2.0,<3", "Telethon>=1.42,<2",
  "httpx>=0.28,<1", "boto3>=1.40,<2", "Pillow>=12,<13",
  "psycopg[binary]>=3.2,<4", "gunicorn>=23,<28",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "moto[s3]>=5,<6", "redis>=8.1,<9"]
redis = ["redis>=8.1,<9"]

[project.scripts]
drg-media = "family_photo.cli:main"
family-photo = "family_photo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["family_photo*"]

[tool.setuptools.dynamic]
version = {attr = "family_photo.__version__"}

[tool.setuptools.package-data]
family_photo = ["assets/*.png", "healthcheck.sh"]
