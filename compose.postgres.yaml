services:
  api:
    environment:
      FP_DATABASE_URL: postgresql+psycopg://family_photo:${FP_POSTGRES_PASSWORD:?Set a separate database password}@family-photo-postgres:5432/family_photo
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    environment:
      FP_DATABASE_URL: postgresql+psycopg://family_photo:${FP_POSTGRES_PASSWORD:?Set a separate database password}@family-photo-postgres:5432/family_photo
  postgres:
    image: postgres:18
    container_name: family-photo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_photo
      POSTGRES_USER: family_photo
      POSTGRES_PASSWORD: ${FP_POSTGRES_PASSWORD:?Set a separate database password}
    volumes:
      - archive-postgres:/var/lib/postgresql
    # The API also joins the site's network, which may have its own "postgres".
    # Keep a unique name for this database without renaming the existing service.
    networks:
      default:
        aliases: [family-photo-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_photo -d family_photo"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  archive-postgres:
